  <script>
  var articles = {
    biochar: {
      title: 'Biochar & Organic Fertilizers',
      tag: 'Farm Products',
      date: 'December 20, 2025',
      author: 'Clement Taonani',
      image: 'images/biochar.jpg',
      body: '<p>At Nthawi Farms, we are proud to be among the leading producers and distributors of high-quality biochar and organic fertilizers in Malawi. Our biochar is produced through the controlled pyrolysis of agricultural waste — including maize cobs, wood chips, and crop residues — transforming what would otherwise be burnt or wasted into a powerful soil amendment.</p><h2>What is Biochar?</h2><p>Biochar is a charcoal-like material produced when organic matter is heated in a low-oxygen environment. When added to soil, biochar improves water retention, enhances nutrient availability, supports beneficial microbial activity, and sequesters carbon — making it both a productivity booster and a climate-smart solution.</p><h2>Why Choose Our Biochar?</h2><p>Our biochar is tested and quality-assured. We work with local smallholder farmers to collect organic waste materials, turning them into valuable inputs while reducing open burning. Each batch is produced under consistent conditions to ensure uniform quality.</p><p>In addition to biochar, we produce and supply a range of organic compost, vermicompost, and liquid fertilizers — all derived from farm waste and animal manure from our livestock operations.</p><h2>Availability & Distribution</h2><p>Our organic fertilizers and biochar are available in 5kg, 25kg, and 50kg packaging and can be delivered anywhere in Malawi. We supply individual farmers, cooperatives, NGOs, and government extension programmes. <a href="contact.html">Contact us</a> to place an order or request a demonstration on your farm.</p>'
    },
    hunger: {
      title: 'Fighting Hunger Through Sustainable Farming',
      tag: 'Community Impact',
      date: 'December 20, 2025',
      author: 'Clement Taonani',
      image: 'images/sugarcane_farm.jpg',
      body: '<p>Food insecurity remains one of the most pressing challenges facing Malawi. At Nthawi Farms, we believe that sustainable, small-scale agriculture is one of the most powerful tools for fighting hunger — and we are committed to sharing that belief through action.</p><h2>Our Sugarcane Training Initiative</h2><p>Our latest initiative brings sugarcane farming training to smallholder farmers across the Southern Region. Unlike many cash crops, sugarcane offers dual benefits: it can be harvested and sold for income while also being used locally for food, juice, and animal fodder. With the right techniques, it is a high-return, low-input crop suited to Malawi\'s climate.</p><h2>What the Training Covers</h2><p>Participants in our sugarcane training programme learn land preparation and soil assessment, variety selection for Malawi\'s soils, planting techniques that maximise yield, integrated pest and disease management, post-harvest handling and market access, and financial planning for crop cycles.</p><p>Training sessions are conducted on our farm and can also be brought to participants\' communities on request. We train in both Chichewa and English to ensure accessibility.</p><h2>Impact So Far</h2><p>Since launching this programme, we have trained over 200 smallholder farmers, with participating households reporting significant improvements in both food availability and household income during the harvest period.</p><p>We are actively seeking partnerships with NGOs, government bodies, and donors to scale this programme. <a href="contact.html">Reach out</a> if you would like to collaborate.</p>'
    },
    maize: {
      title: 'Maize & Grain Production at Nthawi Farms',
      tag: 'Our Produce',
      date: 'January 5, 2026',
      author: 'Nthawi Farms Team',
      image: 'images/img/maize.jpeg',
      body: '<p>Maize is the foundation of food security in Malawi, and at Nthawi Farms, we take its production seriously. We cultivate maize across several hectares using a combination of conventional and conservation agriculture techniques — ensuring consistent yields season after season.</p><h2>Our Approach to Maize Farming</h2><p>We use improved, drought-tolerant maize varieties suited to Malawi\'s diverse agro-ecological zones. Our fields are managed with precision: soil testing before planting, targeted fertiliser application, timely planting to align with seasonal rains, and integrated pest management to minimise losses.</p><h2>Conservation Agriculture</h2><p>We practice minimum tillage and permanent soil cover — techniques that reduce erosion, improve water infiltration, and build long-term soil health. Crop rotation with legumes like beans and soybeans is a regular part of our maize production cycle, naturally restoring nitrogen to the soil.</p><h2>Availability</h2><p>We sell maize grain directly to consumers, processors, and relief programmes. We also supply green (fresh) maize to markets and restaurants during the season. <a href="contact.html">Contact us</a> for current stock and pricing information.</p>'
    },
    vegetables: {
      title: 'Vegetables & Horticulture — Fresh from Our Fields',
      tag: 'Our Produce',
      date: 'January 10, 2026',
      author: 'Nthawi Farms Team',
      image: 'images/img/tomato.jpeg',
      body: '<p>Nthawi Farms operates a thriving horticultural unit producing a wide variety of fresh vegetables for local markets, hotels, restaurants, and export. Our vegetable production benefits from year-round irrigation, skilled agronomists, and integrated pest management protocols.</p><h2>What We Grow</h2><p>Our current vegetable portfolio includes tomatoes, onions, cabbages, leafy greens (rape, Chinese cabbage, spinach), green beans, peas, sweet peppers, and cucumbers. We are continuously trialling new varieties to expand our range and meet evolving market demands.</p><h2>Quality Standards</h2><p>Every vegetable that leaves Nthawi Farms goes through our post-harvest quality check — sorting, grading, and packaging according to market requirements. For institutional buyers, we can package and label to specification. We are working towards GlobalG.A.P. certification to open doors to international buyers.</p><h2>Ordering</h2><p>We supply on a regular basis to supermarkets, hotels, hospitals, and NGO programmes. Minimum order quantities apply for institutional buyers. For pricing and availability, <a href="contact.html">get in touch</a> with our sales team.</p>'
    }
  };

  var related = [
    { id: 'biochar', title: 'Biochar & Organic Fertilizers', img: 'images/biochar.jpg', date: 'Dec 20, 2025' },
    { id: 'hunger', title: 'Fighting Hunger Through Sustainable Farming', img: 'images/sugarcane_farm.jpg', date: 'Dec 20, 2025' },
    { id: 'maize', title: 'Maize & Grain Production', img: 'images/img/maize.jpeg', date: 'Jan 5, 2026' },
    { id: 'vegetables', title: 'Vegetables & Horticulture', img: 'images/img/tomato.jpeg', date: 'Jan 10, 2026' },
  ];

  document.title = article.title + ' — Nthawi Farms';
  document.getElementById('articleHero').style.backgroundImage = "url('" + article.image + "')";
  document.getElementById('articleTag').innerText = article.tag;
  document.getElementById('articleTitle').innerText = article.title;
  document.getElementById('articleMeta').innerHTML = article.date + ' &bullet; by ' + article.author;
  document.getElementById('articleBody').innerHTML = article.body;

  // Related posts (exclude current)
  var relHtml = '';

    relHtml += '<div class="col-md-4"><div class="post-entry mb-4">' +
      '<a href="news-detail.html?id=' + r.id + '" class="thumb"><img src="' + r.img + '" alt="' + r.title + '" class="img-fluid" style="height:180px;object-fit:cover;width:100%"></a>' +
      '<div class="post-entry-contents" style="padding:16px 0"><div class="date" style="margin-bottom:6px">' + r.date + '</div>' +
      '<h3 style="font-size:17px"><a href="news-detail.html?id=' + r.id + '">' + r.title + '</a></h3>' +
      '<a href="news-detail.html?id=' + r.id + '" class="readmore" style="font-size:12px">Read More</a></div>' +
      '</div></div>';
  });
